name: CI Pipeline

on:
  push:           # push pe run karo
  #pull_request:      # PR open hone pe run karo
  #schedule:          # timer pe (jaise har raat 2 baje)
  #  - cron: "0 2 * * *"
  #workflow_dispatch: # manually button dabao GitHub pe
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Conatiner
        run: docker run -d --name ci-web -p 8080:80 hello-site:ci

      - name: smoke test
        curl -f -I http://localhost:8080    

      - name: Build DOcker Image
        run: docker build -t hello-site:ci ./docker/hello-site

      - name: List Images
        run: docker images | head -20



